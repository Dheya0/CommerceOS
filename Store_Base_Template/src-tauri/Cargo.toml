[package]
name = "commerceos-pos-{{SLUG}}"
version = "1.0.0"
description = "CommerceOS Sovereign Desktop POS with Serial Port & Hardware Integration"
authors = ["CommerceOS Engine"]
edition = "2021"

[dependencies]
tauri = { version = "1.5", features = ["shell-execute", "serialall"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.2"
tokio = { version = "1.0", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
